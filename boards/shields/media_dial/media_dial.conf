CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# Den bao hieu: dung den xanh gan san tren board (gpio-leds, P0.15).
CONFIG_ZMK_BACKLIGHT=y
CONFIG_LED_GPIO=y
# De den tat luc khoi dong, chi sang khi macro cho no sang.
CONFIG_ZMK_BACKLIGHT_ON_START=n
CONFIG_ZMK_BACKLIGHT_BRT_START=100

# Muon doc log qua USB thi KHONG bat CONFIG_ZMK_USB_LOGGING o day, vi no con
# can them node cdc-acm-uart trong devicetree. Thay vao do them mot muc build
# trong build.yaml voi "snippet: zmk-usb-logging".
